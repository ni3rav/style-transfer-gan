[project]
name = "style-transfer-gan"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ni3rav", email = "mahetan35@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.3",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "python-multipart>=0.0.32",
    "torch>=2.14.1",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]
